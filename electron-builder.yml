appId: com.rle.desktop-client
productName: RLE Desktop Client

directories:
  output: build

files:
  - src/**/*
  - assets/**/*
  - package.json

win:
  target:
    - nsis
  icon: assets/icon.ico

mac:
  target:
    - dmg
  icon: assets/icon.icns

linux:
  target:
    - AppImage
  icon: assets/icon.png
